name: Verify and deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_SPACE: Sean-Lee-HuggingFace/SoundSpectrum

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall scripts

      - name: Verify static app files
        run: python scripts/verify_static_app.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set."
            exit 1
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git push --force "https://huggingface:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main